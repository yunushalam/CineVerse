<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVerse - Modern Movie Discovery, Downloaded Movies & Player</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-card: rgba(22, 29, 45, 0.85);
            --bg-glass: rgba(255, 255, 255, 0.05);
            --border-glass: rgba(255, 255, 255, 0.1);
            --accent-primary: #e50914;
            --accent-gradient: linear-gradient(135deg, #ff2a55 0%, #e50914 50%, #b81d24 100%);
            --accent-purple: #8b5cf6;
            --accent-gold: #fbbf24;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow-glow: 0 8px 32px rgba(229, 9, 20, 0.35);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(229, 9, 20, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* Navbar Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(16px);
            background: rgba(9, 13, 22, 0.85);
            border-bottom: 1px solid var(--border-glass);
            padding: 1rem 2rem;
        }

        .navbar {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-family: 'Outfit', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
        }

        .logo i {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2rem;
        }

        .logo span {
            background: linear-gradient(135deg, #ffffff 0%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Search Bar Component */
        .search-box {
            position: relative;
            flex: 1;
            max-width: 480px;
        }

        .search-box i {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
            transition: var(--transition);
        }

        .search-input {
            width: 100%;
            padding: 0.85rem 1.25rem 0.85rem 3rem;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-glass);
            border-radius: 50px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-primary);
            box-shadow: 0 0 25px rgba(229, 9, 20, 0.35);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1.3rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            text-decoration: none;
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: var(--shadow-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(229, 9, 20, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid var(--border-glass);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .user-badge {
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.4);
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        /* Container & Layout */
        main {
            max-width: 1300px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        /* Hero Banner */
        .hero {
            background: linear-gradient(135deg, rgba(229, 9, 20, 0.25) 0%, rgba(139, 92, 246, 0.2) 100%), var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 2.5rem 3rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(12px);
        }

        .hero-text h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, #ffffff 0%, #d1d5db 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-text p {
            color: var(--text-muted);
            font-size: 1.05rem;
            max-width: 580px;
        }

        .hero-stats {
            display: flex;
            gap: 2rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 1.25rem 1.75rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-glass);
            text-align: center;
        }

        .stat-card .num {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            color: #fff;
        }

        .stat-card .label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0.25rem;
        }

        /* Filter Pills & Sorting Bar */
        .controls-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .filter-pills {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .pill {
            padding: 0.55rem 1.25rem;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .pill:hover, .pill.active {
            background: var(--accent-gradient);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.35);
        }

        .sort-select {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-glass);
            color: #fff;
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .sort-select option {
            background: #111827;
            color: #fff;
        }

        /* Movie Cards Grid with High Quality Poster Images */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 2rem;
        }

        .movie-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .movie-card:hover {
            transform: translateY(-10px);
            border-color: rgba(229, 9, 20, 0.6);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7), 0 0 30px rgba(229, 9, 20, 0.3);
        }

        .card-poster-wrapper {
            position: relative;
            width: 100%;
            height: 320px;
            overflow: hidden;
            background: #111827;
        }

        .card-poster-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .movie-card:hover .card-poster-img {
            transform: scale(1.08);
        }

        .poster-overlay-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(22, 29, 45, 1) 0%, rgba(22, 29, 45, 0.3) 50%, rgba(0, 0, 0, 0.5) 100%);
        }

        .play-btn-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            z-index: 5;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--accent-gradient);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 30px rgba(229, 9, 20, 0.8);
            transition: var(--transition);
            opacity: 0.9;
            padding-left: 4px;
        }

        .movie-card:hover .play-btn-overlay {
            transform: translate(-50%, -50%) scale(1.15);
            box-shadow: 0 0 45px rgba(229, 9, 20, 1);
            opacity: 1;
        }

        .rating-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            z-index: 6;
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-glass);
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .genre-badge {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            z-index: 6;
            background: var(--accent-gradient);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
        }

        .card-body {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .movie-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .movie-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 0.85rem;
        }

        .movie-director {
            font-size: 0.85rem;
            color: #d1d5db;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .movie-director i {
            color: var(--accent-purple);
        }

        .play-trailer-btn {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            background: rgba(229, 9, 20, 0.18);
            border: 1px solid rgba(229, 9, 20, 0.4);
            color: #fff;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: var(--transition);
            margin-bottom: 1rem;
        }

        .play-trailer-btn:hover {
            background: var(--accent-gradient);
            border-color: transparent;
            box-shadow: 0 4px 20px rgba(229, 9, 20, 0.45);
        }

        .card-footer {
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-glass);
            color: var(--text-muted);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .icon-btn:hover.edit {
            background: rgba(139, 92, 246, 0.2);
            color: var(--accent-purple);
            border-color: var(--accent-purple);
        }

        .icon-btn:hover.delete {
            background: rgba(229, 9, 20, 0.2);
            color: var(--accent-primary);
            border-color: var(--accent-primary);
        }

        .icon-btn:hover.like, .icon-btn.like.active {
            background: rgba(229, 9, 20, 0.1);
            color: var(--accent-primary);
            border-color: var(--accent-primary);
        }

        .content-type-nav {
            max-width: 1300px;
            margin: 0 auto 2rem;
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        .type-icon-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid transparent;
            padding: 1.5rem 3rem;
            border-radius: 16px;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
        }

        .type-icon-btn i {
            font-size: 2rem;
        }

        .type-icon-btn span {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .type-icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-light);
        }

        .type-icon-btn.active {
            background: rgba(229, 9, 20, 0.1);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        /* YouTube Style Player View */
        .youtube-player-view {
            display: none;
            padding: 2rem;
            max-width: 1600px;
            margin: 0 auto;
            min-height: 100vh;
        }

        .youtube-player-view.active {
            display: block;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: var(--text-light);
            font-size: 1.1rem;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            transition: var(--transition);
        }

        .back-btn:hover {
            color: var(--accent-primary);
        }

        .player-grid {
            display: grid;
            grid-template-columns: 2.5fr 1fr;
            gap: 2rem;
            align-items: start;
        }

        @media (max-width: 1024px) {
            .player-grid {
                grid-template-columns: 1fr;
            }
        }

        .player-main {
            background: #111827;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border-glass);
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            background: #000;
            width: 100%;
        }

        .video-wrapper iframe, .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        .player-info {
            padding: 1.5rem;
        }

        .player-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 1rem;
        }

        .player-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 1rem;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            color: var(--text-light);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .player-desc {
            background: rgba(255, 255, 255, 0.03);
            padding: 1rem;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-muted);
        }

        .player-desc strong {
            color: var(--text-light);
        }

        .player-sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .up-next-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .suggested-card {
            display: flex;
            gap: 1rem;
            background: #111827;
            padding: 0.75rem;
            border-radius: 12px;
            border: 1px solid var(--border-glass);
            cursor: pointer;
            transition: var(--transition);
        }

        .suggested-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--accent-primary);
        }

        .suggested-thumb {
            width: 120px;
            height: 68px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .suggested-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .suggested-title {
            font-weight: 600;
            color: var(--text-light);
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .suggested-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Form Modal & Auth Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: #111827;
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            width: 100%;
            max-width: 580px;
            padding: 2rem;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.95);
            transition: var(--transition);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.25rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .close-btn:hover {
            color: #fff;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #d1d5db;
        }

        .form-group input {
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
        }

        .form-group input:focus {
            border-color: var(--accent-primary);
            background: rgba(255, 255, 255, 0.08);
        }

        .file-upload-box {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            margin-top: 0.3rem;
        }

        .file-upload-box input[type="file"] {
            display: none;
        }

        .upload-btn-label {
            background: rgba(229, 9, 20, 0.2);
            border: 1px solid rgba(229, 9, 20, 0.4);
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
        }

        .upload-btn-label:hover {
            background: var(--accent-gradient);
            border-color: transparent;
        }

        .upload-status-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .quick-fill-btn {
            padding: 0.4rem 0.8rem;
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border-glass);
            color: var(--text-muted);
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .quick-fill-btn:hover {
            background: rgba(255,255,255,0.18);
            color: #fff;
        }

        .modal-footer {
            margin-top: 1.75rem;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .toast {
            background: #1f2937;
            border-left: 4px solid var(--accent-primary);
            color: #fff;
            padding: 1rem 1.5rem;
            border-radius: var(--radius-md);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.9rem;
            animation: slideIn 0.3s ease forwards;
        }

        .toast.success {
            border-left-color: #10b981;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Header Navbar -->
    <header>
        <div class="navbar">
            <a href="#" class="logo">
                <i class="fa-solid fa-film"></i>
                <span>CineVerse</span>
            </a>

            <!-- Search Input Box -->
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="Search movies by title (e.g. Inception, Avengers)...">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>

            <div class="nav-actions">
                
                <div id="authNavSection">
                    <button class="btn btn-secondary" onclick="openAuthModal()">
                        <i class="fa-solid fa-user-lock"></i> Login / Register
                    </button>
                </div>

                <button id="addMovieBtn" class="btn btn-primary" onclick="openAddMovieModal()" style="display: none;">
                    <i class="fa-solid fa-plus"></i> Add Movie
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main>
        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-text">
                <h1>Watch Downloaded Movies & HD Trailers</h1>
            </div>
            <div class="hero-stats">
                <div class="stat-card">
                    <div class="num" id="statTotalMovies">0</div>
                    <div class="label">Total Movies</div>
                </div>
                <div class="stat-card">
                    <div class="num" id="statTopRating">0.0</div>
                    <div class="label">Top Rating</div>
                </div>
            </div>
        </section>

        <!-- Content Type Navigation -->
        <section class="content-type-nav">
            <button class="type-icon-btn" id="navTRAILER" onclick="switchContentType('TRAILER')">
                <i class="fa-solid fa-video"></i>
                <span>Trailers</span>
            </button>
            <button class="type-icon-btn active" id="navMOVIE" onclick="switchContentType('MOVIE')">
                <i class="fa-solid fa-film"></i>
                <span>Movies</span>
            </button>
            <button class="type-icon-btn" id="navSONG" onclick="switchContentType('SONG')">
                <i class="fa-solid fa-music"></i>
                <span>Songs</span>
            </button>
        </section>

        <!-- Controls Bar -->
        <section class="controls-bar">
            <div class="filter-pills">
                <button class="pill active" onclick="filterCategory('all', this)">All Movies</button>
                <button class="pill" onclick="filterCategory('top-rated', this)">⭐ Top Rated</button>
                <button class="pill" onclick="filterCategory('latest', this)">🔥 Latest</button>
                <button class="pill" onclick="filterCategory('genre/Action', this)">Action</button>
                <button class="pill" onclick="filterCategory('genre/Sci-Fi', this)">Sci-Fi</button>
                <button class="pill" onclick="filterCategory('genre/Thriller', this)">Thriller</button>
                <button class="pill" onclick="filterCategory('genre/Animation', this)">Animation</button>
            </div>

            <select id="sortSelect" class="sort-select" onchange="handleSortChange(this.value)">
                <option value="id-asc">Default Sort</option>
                <option value="rating-desc">Highest Rated</option>
                <option value="releaseYear-desc">Newest Release</option>
                <option value="title-asc">Title (A-Z)</option>
            </select>
        </section>

        <!-- Movie Cards Grid -->
        <section id="moviesGrid" class="movies-grid">
            <!-- Movie cards injected dynamically via JavaScript -->
        </section>
    </main>

    <!-- YouTube Style Player View -->
    <section id="youtubePlayerView" class="youtube-player-view">
        <button class="back-btn" onclick="closePlayerView()">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </button>
        
        <div class="player-grid">
            <!-- Left Column: Main Player -->
            <div class="player-main">
                <div class="video-wrapper" id="playerVideoContainer">
                    <!-- Injected dynamically: HTML5 <video> or <iframe> -->
                </div>
                
                <div class="player-info">
                    <h2 id="playerMovieTitle" class="player-title">Now Playing</h2>
                    
                    <div class="player-actions">
                        <button class="action-btn" id="playerLikeBtn" onclick="togglePlayerLike(this)">
                            <i class="fa-solid fa-heart"></i> Like
                        </button>
                        <button class="action-btn" onclick="shareMovie()">
                            <i class="fa-solid fa-share"></i> Share
                        </button>
                        <button class="action-btn" id="playerSaveBtn" onclick="togglePlayerSave(this)">
                            <i class="fa-solid fa-bookmark"></i> Save
                        </button>
                    </div>

                    <div class="player-desc" id="playerDesc">
                        <!-- Dynamic metadata -->
                    </div>
                </div>
            </div>

            <!-- Right Column: Suggestions -->
            <div class="player-sidebar">
                <h3 class="up-next-title">Up Next</h3>
                <div id="upNextContainer">
                    <!-- Suggested content injected here -->
                </div>
            </div>
        </div>
    </section>

    <!-- Auth (Login / Register) Modal -->
    <div id="authModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="authModalTitle" class="modal-title">Admin & User Login</h2>
                <button class="close-btn" onclick="closeAuthModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div id="quickFillSection" style="display:flex; gap:0.5rem; margin-bottom:1.25rem;">
                <button type="button" class="quick-fill-btn" onclick="fillQuickAuth('admin', 'adminpassword')">⚡ Fill Admin Credentials</button>
                <button type="button" class="quick-fill-btn" onclick="fillQuickAuth('user', 'userpassword')">👤 Fill User Credentials</button>
            </div>

            <form id="authForm" onsubmit="handleAuthSubmit(event)">
                <div class="form-group full">
                    <label for="authUsernameInput" id="authUsernameLabel">Username or Email *</label>
                    <input type="text" id="authUsernameInput" placeholder="admin or user@cineverse.com" required>
                </div>
                <div class="form-group full" id="authEmailGroup" style="display:none; margin-top:1rem;">
                    <label for="authEmailInput">Email Address *</label>
                    <input type="email" id="authEmailInput" placeholder="Enter your email">
                </div>
                <div class="form-group full" style="margin-top:1rem;">
                    <label for="authPasswordInput">Password *</label>
                    <input type="password" id="authPasswordInput" placeholder="Enter your password" required>
                </div>
                <div style="margin-top:1rem; text-align:center;">
                    <a href="#" style="color:var(--accent-secondary); font-size:0.9rem;" onclick="toggleAuthMode(event)" id="authToggleLink">Don't have an account? Sign Up</a>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeAuthModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="authSubmitBtn">Login</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add/Edit Movie Modal -->
    <div id="movieModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle" class="modal-title">Add New Movie</h2>
                <button class="close-btn" onclick="closeMovieModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="movieForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="movieId">
                <div class="form-grid">
                    <div class="form-group full">
                        <label for="contentTypeInput">Content Type *</label>
                        <select id="contentTypeInput" required style="width: 100%; padding: 0.75rem; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); color: var(--text-light); outline: none;">
                            <option value="MOVIE" style="color: black;">Movie</option>
                            <option value="TRAILER" style="color: black;">Trailer</option>
                            <option value="SONG" style="color: black;">Song</option>
                        </select>
                    </div>
                    <div class="form-group full">
                        <label for="titleInput">Title *</label>
                        <input type="text" id="titleInput" placeholder="e.g. Oppenheimer" required>
                    </div>
                    <div class="form-group">
                        <label for="genreInput">Genre *</label>
                        <input type="text" id="genreInput" placeholder="e.g. Sci-Fi, Action" required>
                    </div>
                    <div class="form-group">
                        <label for="languageInput">Language *</label>
                        <input type="text" id="languageInput" placeholder="e.g. English" required>
                    </div>
                    <div class="form-group">
                        <label for="yearInput">Release Year (>=1900) *</label>
                        <input type="number" id="yearInput" min="1900" placeholder="e.g. 2023" required>
                    </div>
                    <div class="form-group">
                        <label for="ratingInput">Rating (0.0 - 10.0) *</label>
                        <input type="number" id="ratingInput" step="0.1" min="0" max="10" placeholder="e.g. 8.9" required>
                    </div>
                    <div class="form-group">
                        <label for="durationInput">Duration (Minutes) *</label>
                        <input type="number" id="durationInput" min="1" placeholder="e.g. 180" required>
                    </div>
                    <div class="form-group">
                        <label for="directorInput">Director *</label>
                        <input type="text" id="directorInput" placeholder="e.g. Christopher Nolan" required>
                    </div>

                    <!-- Upload Downloaded Movie File -->
                    <div class="form-group full">
                        <label>📁 Upload Downloaded Movie File (.mp4, .mkv, .webm)</label>
                        <div class="file-upload-box">
                            <label for="localVideoFileInput" class="upload-btn-label">
                                <i class="fa-solid fa-upload"></i> Choose Movie File
                            </label>
                            <input type="file" id="localVideoFileInput" accept="video/*" onchange="handleFileUpload(this, 'videoUrlInput', 'videoUploadStatus')">
                            <span class="upload-status-text" id="videoUploadStatus">No local file selected</span>
                        </div>
                    </div>

                    <div class="form-group full">
                        <label for="videoUrlInput">Video / Trailer URL (or Uploaded Local File Path)</label>
                        <input type="text" id="videoUrlInput" placeholder="e.g. /uploads/17859000_movie.mp4 or YouTube embed URL">
                    </div>

                    <!-- Upload Local Poster Image -->
                    <div class="form-group full">
                        <label>🖼️ Upload Local Poster Image (.jpg, .png, .webp)</label>
                        <div class="file-upload-box">
                            <label for="localPosterFileInput" class="upload-btn-label">
                                <i class="fa-solid fa-image"></i> Choose Poster Image
                            </label>
                            <input type="file" id="localPosterFileInput" accept="image/*" onchange="handleFileUpload(this, 'posterUrlInput', 'posterUploadStatus')">
                            <span class="upload-status-text" id="posterUploadStatus">No local image selected</span>
                        </div>
                    </div>

                    <div class="form-group full">
                        <label for="posterUrlInput">Poster Image URL (or Uploaded Poster Path)</label>
                        <input type="text" id="posterUrlInput" placeholder="e.g. /uploads/17859000_poster.jpg or Image web URL">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeMovieModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save Movie</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- JavaScript Application Logic -->
    <script>
        const API_BASE = '/movies';
        const AUTH_BASE = '/api/auth';
        let allMovies = [];
        let currentContentType = 'MOVIE';

        function switchContentType(type) {
            currentContentType = type;
            document.querySelectorAll('.type-icon-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('nav' + type).classList.add('active');
            
            const searchInput = document.getElementById('searchInput');
            if (searchInput && searchInput.value.trim().length > 0) {
                searchMovies(searchInput.value.trim());
            } else {
                fetchMovies(); 
            }
        }

        const defaultPosters = {
            'Inception': 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=600&q=80',
            'The Dark Knight': 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=600&q=80',
            'Interstellar': 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=600&q=80',
            'Parasite': 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=600&q=80',
            'Avengers: Endgame': 'https://images.unsplash.com/photo-1635805737707-575885ab0820?auto=format&fit=crop&w=600&q=80',
            'Spirited Away': 'https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=600&q=80'
        };

        document.addEventListener('DOMContentLoaded', () => {
            checkAuthStatus();
            fetchMovies();

            const searchInput = document.getElementById('searchInput');
            let debounceTimer;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    const query = e.target.value.trim();
                    if (query.length > 0) {
                        searchMovies(query);
                    } else {
                        fetchMovies();
                    }
                }, 300);
            });
        });

        // Toggle Like Button
        function toggleLike(btn, movieId) {
            if (btn.classList.contains('active')) {
                btn.classList.remove('active');
                btn.style.color = 'var(--text-muted)';
                showToast('Removed from liked movies', 'info');
            } else {
                btn.classList.add('active');
                btn.style.color = 'var(--accent-primary)';
                showToast('Added to liked movies! ❤️', 'success');
            }
        }

        // Authentication State Check
        function checkAuthStatus() {
            const token = localStorage.getItem('jwt_token');
            const username = localStorage.getItem('jwt_username');
            const role = localStorage.getItem('jwt_role');
            const authNav = document.getElementById('authNavSection');
            const addMovieBtn = document.getElementById('addMovieBtn');

            if (token && username) {
                authNav.innerHTML = `
                    <div class="user-badge">
                        <i class="fa-solid fa-user-check"></i> ${escapeHtml(username)}
                        <button onclick="logoutUser()" style="background:none; border:none; color:#ef4444; cursor:pointer; font-weight:700; margin-left:4px;" title="Logout">
                            <i class="fa-solid fa-right-from-bracket"></i>
                        </button>
                    </div>
                `;
                if (addMovieBtn) addMovieBtn.style.display = (role === 'ROLE_ADMIN') ? 'inline-flex' : 'none';
            } else {
                authNav.innerHTML = `
                    <button class="btn btn-secondary" onclick="openAuthModal()">
                        <i class="fa-solid fa-user-lock"></i> Login / Register
                    </button>
                `;
                if (addMovieBtn) addMovieBtn.style.display = 'none';
            }
        }

        function openAuthModal() {
            document.getElementById('authModal').classList.add('active');
        }

        function closeAuthModal() {
            document.getElementById('authModal').classList.remove('active');
        }

        function fillQuickAuth(user, pass) {
            document.getElementById('authUsernameInput').value = user;
            document.getElementById('authPasswordInput').value = pass;
        }

        let isLoginMode = true;

        function toggleAuthMode(e) {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            const title = document.getElementById('authModalTitle');
            const submitBtn = document.getElementById('authSubmitBtn');
            const toggleLink = document.getElementById('authToggleLink');
            const emailGroup = document.getElementById('authEmailGroup');
            const emailInput = document.getElementById('authEmailInput');
            const quickFill = document.getElementById('quickFillSection');
            const usernameLabel = document.getElementById('authUsernameLabel');
            
            if (isLoginMode) {
                title.textContent = 'Admin & User Login';
                submitBtn.textContent = 'Login';
                toggleLink.textContent = "Don't have an account? Sign Up";
                emailGroup.style.display = 'none';
                emailInput.removeAttribute('required');
                quickFill.style.display = 'flex';
                usernameLabel.textContent = 'Username or Email *';
            } else {
                title.textContent = 'Create an Account';
                submitBtn.textContent = 'Sign Up';
                toggleLink.textContent = "Already have an account? Login";
                emailGroup.style.display = 'flex';
                emailInput.setAttribute('required', 'true');
                quickFill.style.display = 'none';
                usernameLabel.textContent = 'Username *';
            }
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('authUsernameInput').value.trim();
            const password = document.getElementById('authPasswordInput').value;

            try {
                if (isLoginMode) {
                    const response = await fetch(`${AUTH_BASE}/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ usernameOrEmail: usernameInput, password })
                    });
                    const result = await response.json();
                    if (response.ok && result.success) {
                        localStorage.setItem('jwt_token', result.data.accessToken);
                        localStorage.setItem('jwt_username', result.data.username);
                        localStorage.setItem('jwt_role', result.data.role);
                        showToast(`Welcome back, ${result.data.username}!`, 'success');
                        closeAuthModal();
                        checkAuthStatus();
                        fetchMovies();
                    } else {
                        showToast(result.message || 'Invalid login credentials', 'error');
                    }
                } else {
                    const email = document.getElementById('authEmailInput').value.trim();
                    const response = await fetch(`${AUTH_BASE}/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: usernameInput, email, password, role: 'ROLE_USER' })
                    });
                    const result = await response.json();
                    if (response.ok || response.status === 201) {
                        showToast('Account created successfully! Please login.', 'success');
                        toggleAuthMode({ preventDefault: () => {} }); // switch back to login mode
                        document.getElementById('authUsernameInput').value = usernameInput;
                        document.getElementById('authPasswordInput').value = '';
                    } else {
                        showToast(result.message || 'Registration failed', 'error');
                    }
                }
            } catch (err) {
                showToast('Authentication server error', 'error');
            }
        }

        function logoutUser() {
            localStorage.removeItem('jwt_token');
            localStorage.removeItem('jwt_username');
            localStorage.removeItem('jwt_role');
            showToast('Logged out successfully', 'success');
            checkAuthStatus();
            fetchMovies();
        }

        // Helper: Get Auth Header for Modification Requests
        function getAuthHeaders() {
            const token = localStorage.getItem('jwt_token');
            return token ? { 'Authorization': `Bearer ${token}` } : {};
        }

        // Handle Local File Upload
        async function handleFileUpload(fileInput, targetInputId, statusSpanId) {
            const file = fileInput.files[0];
            if (!file) return;

            const statusSpan = document.getElementById(statusSpanId);
            statusSpan.textContent = `Uploading ${file.name}...`;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const headers = getAuthHeaders();
                const response = await fetch(`${API_BASE}/upload`, {
                    method: 'POST',
                    headers: headers,
                    body: formData
                });

                const result = await response.json();
                if (response.ok && result.success) {
                    document.getElementById(targetInputId).value = result.data;
                    statusSpan.textContent = `Uploaded: ${file.name}`;
                    showToast(`File uploaded successfully! Saved as ${result.data}`, 'success');
                } else {
                    statusSpan.textContent = `Upload failed`;
                    showToast(result.message || 'File upload failed (Please login first)', 'error');
                }
            } catch (err) {
                console.error(err);
                statusSpan.textContent = `Upload failed`;
                showToast('Error uploading file to server', 'error');
            }
        }

        // Fetch All Movies
        async function fetchMovies(endpoint = '') {
            try {
                const url = endpoint ? `${API_BASE}/${endpoint}` : API_BASE;
                const response = await fetch(url);
                const result = await response.json();
                if (result.success) {
                    allMovies = result.data;
                    renderMovies(allMovies);
                    updateStats(allMovies);
                } else {
                    showToast(result.message || 'Failed to fetch movies', 'error');
                }
            } catch (err) {
                console.error(err);
                showToast('Error connecting to CineVerse server', 'error');
            }
        }

        // Search Movies by Title
        async function searchMovies(query) {
            try {
                const response = await fetch(`${API_BASE}/search?title=${encodeURIComponent(query)}`);
                const result = await response.json();
                if (result.success) {
                    renderMovies(result.data);
                }
            } catch (err) {
                console.error(err);
            }
        }

        // Filter Category Pill Handler
        function filterCategory(category, element) {
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            element.classList.add('active');

            if (category === 'all') {
                fetchMovies();
            } else {
                fetchMovies(category);
            }
        }

        // Sort Handler
        function handleSortChange(sortVal) {
            const [sortBy, sortDir] = sortVal.split('-');
            if (sortBy === 'id') {
                fetchMovies();
            } else {
                fetchMovies(`?sortBy=${sortBy}&sortDir=${sortDir}`);
            }
        }

        // Play Movie / YouTube Style View
        function playMovieTrailer(id) {
            const movie = allMovies.find(m => m.id === id);
            if (!movie) return;
            
            const title = movie.title;
            let targetUrl = movie.videoUrl || defaultTrailers[title] || 'https://www.youtube.com/embed/YoHD9XEInc0';
            
            // Convert standard YouTube watch URLs to embed
            if (targetUrl.includes('youtube.com/watch?v=')) {
                targetUrl = targetUrl.replace('youtube.com/watch?v=', 'youtube.com/embed/');
                const ampersandIdx = targetUrl.indexOf('&');
                if (ampersandIdx !== -1) targetUrl = targetUrl.substring(0, ampersandIdx);
            } else if (targetUrl.includes('youtu.be/')) {
                targetUrl = targetUrl.replace('youtu.be/', 'youtube.com/embed/');
                const questionIdx = targetUrl.indexOf('?');
                if (questionIdx !== -1) targetUrl = targetUrl.substring(0, questionIdx);
            }
            
            document.querySelector('header').style.display = 'none';
            document.querySelector('main').style.display = 'none';
            
            document.getElementById('playerMovieTitle').textContent = title;
            document.getElementById('playerDesc').innerHTML = `
                <p><strong>Release Year:</strong> ${movie.releaseYear} &nbsp;|&nbsp; <strong>Duration:</strong> ${movie.duration} min &nbsp;|&nbsp; <strong>Rating:</strong> ⭐ ${movie.rating}</p>
                <p style="margin-top:0.5rem"><strong>Director:</strong> ${escapeHtml(movie.director)} &nbsp;|&nbsp; <strong>Genre:</strong> ${escapeHtml(movie.genre)} &nbsp;|&nbsp; <strong>Language:</strong> ${escapeHtml(movie.language)}</p>
            `;
            
            const container = document.getElementById('playerVideoContainer');
            const isLocalVideo = targetUrl.startsWith('/uploads/') || targetUrl.match(/\.(mp4|mkv|webm|avi|mov)$/i);

            if (isLocalVideo) {
                container.innerHTML = `
                    <video controls autoplay class="html5-player" style="width:100%; height:100%; object-fit:contain;">
                        <source src="${targetUrl}" type="video/mp4">
                        Your browser does not support HTML5 video tag.
                    </video>
                `;
            } else {
                const autoPlayUrl = targetUrl + (targetUrl.includes('?') ? '&autoplay=1' : '?autoplay=1');
                container.innerHTML = `
                    <iframe id="videoIframe" src="${autoPlayUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                `;
            }

            renderUpNext(movie.id, movie.contentType || 'MOVIE');
            
            document.getElementById('youtubePlayerView').classList.add('active');
            window.scrollTo(0, 0);
        }

        function closePlayerView() {
            document.getElementById('youtubePlayerView').classList.remove('active');
            document.getElementById('playerVideoContainer').innerHTML = '';
            document.querySelector('header').style.display = 'flex';
            document.querySelector('main').style.display = 'block';
        }

        function renderUpNext(currentId, contentType) {
            const suggestions = allMovies.filter(m => (m.contentType || 'MOVIE') === contentType && m.id !== currentId);
            const container = document.getElementById('upNextContainer');
            
            if (suggestions.length === 0) {
                container.innerHTML = '<p class="text-muted">No suggested content found.</p>';
                return;
            }

            container.innerHTML = suggestions.map(m => {
                const posterSrc = m.posterUrl || defaultPosters[m.title] || 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=600&q=80';
                return `
                <div class="suggested-card" onclick="playMovieTrailer(${m.id})">
                    <img src="${posterSrc}" class="suggested-thumb" alt="${escapeHtml(m.title)}">
                    <div class="suggested-info">
                        <div class="suggested-title">${escapeHtml(m.title)}</div>
                        <div class="suggested-meta">${escapeHtml(m.director)} • ${m.releaseYear}</div>
                        <div class="suggested-meta" style="margin-top:2px;">⭐ ${m.rating.toFixed(1)}</div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function togglePlayerLike(btn) {
            if (btn.classList.contains('active')) {
                btn.classList.remove('active');
                btn.style.color = '';
                showToast('Removed from liked videos', 'info');
            } else {
                btn.classList.add('active');
                btn.style.color = 'var(--accent-primary)';
                showToast('Added to liked videos! ❤️', 'success');
            }
        }

        function shareMovie() {
            if (navigator.share) {
                navigator.share({
                    title: 'CineVerse',
                    text: 'Check out this awesome video on CineVerse!',
                    url: window.location.href
                }).catch(err => console.log('Share failed:', err));
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    showToast('Link copied to clipboard!', 'success');
                });
            }
        }

        function togglePlayerSave(btn) {
            if (btn.classList.contains('active')) {
                btn.classList.remove('active');
                btn.style.color = '';
                showToast('Removed from saved videos', 'info');
            } else {
                btn.classList.add('active');
                btn.style.color = 'var(--accent-purple)';
                showToast('Added to saved videos! 🔖', 'success');
            }
        }

        // Render Movie Cards to Grid
        function renderMovies(movies) {
            movies = movies.filter(m => (m.contentType || 'MOVIE') === currentContentType);
            const grid = document.getElementById('moviesGrid');
            if (!movies || movies.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-film"></i>
                        <h3>No Movies Found</h3>
                        <p class="text-muted">Try adjusting your search criteria or upload a new downloaded movie to the collection.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = movies.map(movie => {
                const posterSrc = movie.posterUrl || defaultPosters[movie.title] || 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=600&q=80';
                return `
                <div class="movie-card">
                    <div class="card-poster-wrapper">
                        <img src="${posterSrc}" alt="${escapeHtml(movie.title)} Poster" class="card-poster-img" onerror="this.src='https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=600&q=80'">
                        <div class="poster-overlay-gradient"></div>
                        <button class="play-btn-overlay" title="Play Movie" onclick="playMovieTrailer(${movie.id})">
                            <i class="fa-solid fa-play"></i>
                        </button>
                        <div class="rating-badge"><i class="fa-solid fa-star"></i> ${movie.rating.toFixed(1)}</div>
                        <span class="genre-badge">${escapeHtml(movie.genre)}</span>
                    </div>
                    <div class="card-body">
                        <h3 class="movie-title">${escapeHtml(movie.title)}</h3>
                        <div class="movie-meta">
                            <span><i class="fa-regular fa-calendar"></i> ${movie.releaseYear}</span>
                            <span><i class="fa-regular fa-clock"></i> ${movie.duration} min</span>
                            <span><i class="fa-solid fa-language"></i> ${escapeHtml(movie.language)}</span>
                        </div>
                        <div class="movie-director">
                            <i class="fa-solid fa-clapperboard"></i> Dir. ${escapeHtml(movie.director)}
                        </div>
                        <button class="play-trailer-btn" onclick="playMovieTrailer('${escapeHtml(movie.title)}', '${movie.videoUrl || ''}')">
                            <i class="fa-solid fa-circle-play"></i> Watch Movie / Video
                        </button>
                        ${localStorage.getItem('jwt_role') === 'ROLE_ADMIN' ? `
                        <div class="card-footer">
                            <button class="icon-btn edit" title="Edit Movie" onclick="openEditMovieModal(${movie.id})">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button class="icon-btn delete" title="Delete Movie" onclick="deleteMovie(${movie.id})">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                        ` : (localStorage.getItem('jwt_role') === 'ROLE_USER' ? `
                        <div class="card-footer">
                            <button class="icon-btn like" title="Like Movie" onclick="toggleLike(this, ${movie.id})" style="color: var(--text-muted);">
                                <i class="fa-solid fa-heart"></i>
                            </button>
                        </div>
                        ` : '')}
                    </div>
                </div>
            `;
            }).join('');
        }

        // Update Header Stats
        function updateStats(movies) {
            document.getElementById('statTotalMovies').textContent = movies.length;
            const topRating = movies.length > 0 ? Math.max(...movies.map(m => m.rating)) : 0;
            document.getElementById('statTopRating').textContent = topRating.toFixed(1);
        }

        // Open Add Modal
        function openAddMovieModal() {
            document.getElementById('modalTitle').textContent = 'Add New Content';
            document.getElementById('movieForm').reset();
            document.getElementById('contentTypeInput').value = currentContentType;
            document.getElementById('movieId').value = '';
            document.getElementById('videoUploadStatus').textContent = 'No local file selected';
            document.getElementById('posterUploadStatus').textContent = 'No local image selected';
            document.getElementById('movieModal').classList.add('active');
        }

        // Open Edit Modal
        async function openEditMovieModal(id) {
            try {
                const response = await fetch(`${API_BASE}/${id}`);
                const result = await response.json();
                if (result.success) {
                    const m = result.data;
                    document.getElementById('modalTitle').textContent = 'Edit Content';
                    document.getElementById('movieId').value = m.id;
                    document.getElementById('contentTypeInput').value = m.contentType || 'MOVIE';
                    document.getElementById('titleInput').value = m.title;
                    document.getElementById('genreInput').value = m.genre;
                    document.getElementById('languageInput').value = m.language;
                    document.getElementById('yearInput').value = m.releaseYear;
                    document.getElementById('ratingInput').value = m.rating;
                    document.getElementById('durationInput').value = m.duration;
                    document.getElementById('directorInput').value = m.director;
                    document.getElementById('posterUrlInput').value = m.posterUrl || '';
                    document.getElementById('videoUrlInput').value = m.videoUrl || '';
                    document.getElementById('videoUploadStatus').textContent = m.videoUrl ? 'File set: ' + m.videoUrl : 'No local file selected';
                    document.getElementById('posterUploadStatus').textContent = m.posterUrl ? 'Image set: ' + m.posterUrl : 'No local image selected';
                    document.getElementById('movieModal').classList.add('active');
                }
            } catch (err) {
                showToast('Failed to load movie details', 'error');
            }
        }

        // Close Modal
        function closeMovieModal() {
            document.getElementById('movieModal').classList.remove('active');
        }

        // Save (Add / Update) Movie Handler
        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('movieId').value;
            const payload = {
                contentType: document.getElementById('contentTypeInput').value,
                title: document.getElementById('titleInput').value.trim(),
                genre: document.getElementById('genreInput').value.trim(),
                language: document.getElementById('languageInput').value.trim(),
                releaseYear: parseInt(document.getElementById('yearInput').value),
                rating: parseFloat(document.getElementById('ratingInput').value),
                duration: parseInt(document.getElementById('durationInput').value),
                director: document.getElementById('directorInput').value.trim(),
                posterUrl: document.getElementById('posterUrlInput').value.trim(),
                videoUrl: document.getElementById('videoUrlInput').value.trim()
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_BASE}/${id}` : API_BASE;

            try {
                const headers = {
                    'Content-Type': 'application/json',
                    ...getAuthHeaders()
                };

                const response = await fetch(url, {
                    method: method,
                    headers: headers,
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                if (response.ok && result.success) {
                    showToast(id ? 'Movie updated successfully!' : 'Movie created successfully!', 'success');
                    closeMovieModal();
                    fetchMovies();
                } else {
                    const errMsg = result.fieldErrors 
                        ? Object.values(result.fieldErrors).join(', ') 
                        : (result.message || 'Error saving movie. Please login first.');
                    showToast(errMsg, 'error');
                }
            } catch (err) {
                showToast('Server error while saving movie', 'error');
            }
        }

        // Delete Movie
        async function deleteMovie(id) {
            if (!confirm('Are you sure you want to delete this movie?')) return;
            try {
                const headers = getAuthHeaders();
                const response = await fetch(`${API_BASE}/${id}`, {
                    method: 'DELETE',
                    headers: headers
                });
                const result = await response.json();
                if (result.success) {
                    showToast('Movie deleted successfully', 'success');
                    fetchMovies();
                } else {
                    showToast(result.message || 'Failed to delete movie. Please login first.', 'error');
                }
            } catch (err) {
                showToast('Error connecting to server', 'error');
            }
        }

        // Toast Notification System
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.remove();
            }, 4000);
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</body>
</html>
