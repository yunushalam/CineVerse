# Application Configuration
spring.application.name=CineVerse API
server.port=${PORT:8080}

# -------------------------------------------------------------
# DATABASE CONFIGURATION - DEFAULT: H2 FILE-BASED DATABASE (Persistent)
# -------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/cineversedb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 Web Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------------------------------------------
# DATABASE CONFIGURATION - MYSQL (Uncomment to use MySQL)
# -------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/cineverse_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------
# JPA / HIBERNATE CONFIGURATION
# -------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Use MySQL Dialect when using MySQL database:
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------
# OPENAPI / SWAGGER CONFIGURATION
# -------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.show-actuator=false

# -------------------------------------------------------------
# FILE UPLOAD CONFIGURATION (Support large downloaded movies up to 2GB)
# -------------------------------------------------------------
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

# -------------------------------------------------------------
# SECURITY & JWT CONFIGURATION
# -------------------------------------------------------------
app.jwt-secret=9a2f8c7e6b5d4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a9f
app.jwt-expiration-milliseconds=604800000
