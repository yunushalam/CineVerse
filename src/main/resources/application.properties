# Application Configuration
spring.application.name=yunushVerse API
server.port=${PORT:8080}

# -------------------------------------------------------------
# DATABASE CONFIGURATION
# Defaults to H2 in-memory DB for local testing, 
# but uses environment variables for production remote DBs.
# -------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:cineversedb}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Enable H2 Web Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------------------------------------------
# DATABASE CONFIGURATION - MYSQL (Uncomment to use MySQL)
# -------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/cineverse_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------
# JPA / HIBERNATE CONFIGURATION
# -------------------------------------------------------------
# spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
# Use MySQL Dialect when using MySQL database:
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------
# OPENAPI / SWAGGER CONFIGURATION
# -------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.show-actuator=false

# -------------------------------------------------------------
# FILE UPLOAD CONFIGURATION (Unlimited Size)
# -------------------------------------------------------------
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1

# -------------------------------------------------------------
# SECURITY & JWT CONFIGURATION
# -------------------------------------------------------------
app.jwt-secret=9a2f8c7e6b5d4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a9f
app.jwt-expiration-milliseconds=604800000

# -------------------------------------------------------------
# CLOUDINARY CONFIGURATION (Cloud Storage)
# -------------------------------------------------------------
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:demo_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:demo_api_secret}
